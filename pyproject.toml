[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "people-helper"
version = "0.3.0"
description = "Find what's extractable from your private code — then ship it as open source."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ehsas317", email = "Ehsas317@users.noreply.github.com" },
]
keywords = [
  "github", "open-source", "code-analysis", "extractables",
  "side-projects", "read-only", "fine-grained-pat", "competitive-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Ehsas317/people-helper"
Repository = "https://github.com/Ehsas317/people-helper"
Issues = "https://github.com/Ehsas317/people-helper/issues"

[project.scripts]
people-helper = "people_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
norecursedirs = [
  "tests/fixtures",
  ".git",
  "node_modules",
  "venv",
  ".venv",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # function call in argument defaults (common in typer/click)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in tests is fine
"tests/conftest.py" = ["E402"]  # sys.path.insert before imports is intentional
"tests/test_end_to_end.py" = ["E402"]  # same
"src/people_helper/cli.py" = ["E402"]  # sys.path injection before package imports
"src/people_helper/__main__.py" = ["E402"]
