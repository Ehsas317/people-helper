name: Tests

on:
  push:
    branches: [main, improvements-v0.3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
        continue-on-error: true  # warnings shouldn't fail CI

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run end-to-end on people-helper itself (no network)
        run: |
          PYTHONPATH=src python -m people_helper.cli \
            --repo ${{ github.repository }} \
            --no-network \
            --output /tmp/e2e-report.md
          head -20 /tmp/e2e-report.md
