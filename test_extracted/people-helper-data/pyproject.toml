[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "people-helper-data"
version = "0.1.0"
description = "Data structures for People Helper."
readme = "README.md"
requires-python = ">=3.9"
# TODO: confirm license and uncomment. See LICENSE-REVIEW.md.
# license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["python", "library", "open-source", "structures", "people"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
# TODO: replace with your actual GitHub URL
Homepage = "https://github.com/Ehsas317/people-helper-data"

[tool.hatch.build.targets.wheel]
packages = ["people_helper_data"]
